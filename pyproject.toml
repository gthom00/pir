[project]
name = "pir"
version = "0.1.0"
description = "a cozy little Navidrome client for your terminal"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
    "keyring>=24",
    "requests>=2.31",
]

[project.scripts]
pir = "pir:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["pir.py"]
